name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build, test and package (single exe)
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Mode onefile -Python "python"
      - name: Build and package (folder version, no extraction at start)
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Mode onedir -Python "python" -SkipTests
      - name: Upload folder version (recommended)
        uses: actions/upload-artifact@v4
        with:
          name: PixelRPGAssetStudio-windows-folder
          path: dist/*-onedir.zip
          if-no-files-found: error
      - name: Upload single exe
        uses: actions/upload-artifact@v4
        with:
          name: PixelRPGAssetStudio-windows-single-exe
          path: dist/PixelRPGAssetStudio.exe
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PixelRPGAssetStudio.exe
            dist/*.zip
