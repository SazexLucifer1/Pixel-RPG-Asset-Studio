name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "onefile (single exe) or onedir"
        default: onefile
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Mode "${{ github.event.inputs.mode || 'onefile' }}" -Python "python"
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PixelRPGAssetStudio-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
